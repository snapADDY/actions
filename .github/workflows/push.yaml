name: Lint and Test
on:
  pull_request:
  push:

jobs:
  go-lint-test:
    runs-on: ubuntu-latest
    steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-go@v5
          with:
            go-version-file: go.mod

        - name: golangci-lint
          uses: golangci/golangci-lint-action@v8
          with:
            version: v2.1

        - run: make test
